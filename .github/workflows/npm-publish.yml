# Publish to npm when a version tag is pushed (v0.1.0 -> tag v0.1.0).
#
name: npm publish

on:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines is >=20, but the runner image for 20 is deprecated on GitHub Actions
        # (https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/),
        # so the matrix tests the maintained lines: the LTS floor, the newer LTS, and the
        # measured major (the suite is pinned to 26, see CONTRIBUTING.md 1).
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run lint
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC: npm verifies the publish came from this repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
